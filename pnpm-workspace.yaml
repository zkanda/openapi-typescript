packages:
  - docs
  - packages/**

catalog:
  execa: ^9.6.1
  typescript: ^5.9.3
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0

ignoredBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - sharp
  - svelte-preprocess

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
