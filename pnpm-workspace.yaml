packages:
  - docs
  - packages/**

catalog:
  execa: ^10.2.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5

ignoredBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - sharp
  - svelte-preprocess

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
